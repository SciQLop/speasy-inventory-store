name: Wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: windows-latest, target: x64 }
          # one universal2 wheel covers both Mac architectures; it is tested on the arm64 runner
          - { os: macos-latest, target: universal2-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # the wheel is abi3: testing on the oldest supported Python checks that limit
          python-version: '3.10'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Test the wheel
        shell: bash
        run: |
          # the fixture holds HAPI nodes, whose types no speasy release knows yet: use main until one does
          python -m pip install pytest "speasy @ git+https://github.com/SciQLop/speasy@main"
          python -m pip install --no-index --find-links dist speasy-inventory-store
          python -m pytest -q tests
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: github.event_name == 'release'
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
